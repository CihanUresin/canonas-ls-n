<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş Yap · Sunucum</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem;
         font-family: system-ui, sans-serif; background:#F5EBD8; color:#3A1218; }
  main { width:100%; max-width:22rem; padding:2rem; background:#FFFAF0;
         border:1px solid #D9C9A8; border-top:4px solid #2F6B45; border-radius:1rem; }
  h1 { font-size:1.75rem; margin:0 0 .25rem; }
  .sub { opacity:.75; margin:0 0 1.5rem; }
  label { display:block; font-size:.875rem; margin:1rem 0 .375rem; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; padding:.7rem .8rem; font:inherit; color:inherit;
    background:#fff; border:1px solid #CDBB96; border-radius:.5rem; }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline:2px solid #2F6B45; outline-offset:2px; }
  .pw { position:relative; }
  .pw input { padding-right:4.5rem; }
  .pw button { position:absolute; right:.35rem; top:50%; transform:translateY(-50%);
    padding:.35rem .6rem; font:inherit; font-size:.8rem; color:#2F6B45;
    background:none; border:0; border-radius:.375rem; cursor:pointer; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:.5rem;
         flex-wrap:wrap; margin:1rem 0 1.25rem; font-size:.875rem; }
  .row label { display:flex; align-items:center; gap:.4rem; margin:0; }
  a { color:#2F6B45; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .submit { width:100%; padding:.75rem; font:inherit; font-weight:600; color:#fff;
    background:#6D1A2A; border:0; border-radius:.5rem; cursor:pointer; }
  .submit:hover { background:#8A2337; }
  .submit:disabled { opacity:.6; cursor:progress; }
  .err { color:#B3261E; font-size:.8rem; margin:.35rem 0 0; min-height:1em; }
  input[aria-invalid=true] { border-color:#B3261E; }
  #status { margin:1rem 0 0; font-size:.875rem; text-align:center; min-height:1.2em; }
  #status.bad { color:#B3261E; }
  #status.ok { color:#2F6B45; }
  .foot { margin:1.25rem 0 0; font-size:.875rem; text-align:center; opacity:.85; }
</style>
</head>
<body>
<main>
  <h1>Giriş Yap</h1>
  <p class="sub">Hesabınıza erişmek için bilgilerinizi girin.</p>

  <form id="login" novalidate>
    <label for="username">Kullanıcı adı</label>
    <input id="username" name="username" type="text" autocomplete="username" maxlength="20"
           autocapitalize="none" spellcheck="false" required aria-describedby="username-err">
    <p class="err" id="username-err" aria-live="polite"></p>

    <label for="email">E-posta</label>
    <input id="email" name="email" type="email" autocomplete="email"
           placeholder="ornek@eposta.com" required aria-describedby="email-err">
    <p class="err" id="email-err" aria-live="polite"></p>

    <label for="password">Şifre</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password"
             minlength="6" required aria-describedby="password-err">
      <button type="button" id="toggle" aria-controls="password" aria-pressed="false">Göster</button>
    </div>
    <p class="err" id="password-err" aria-live="polite"></p>

    <div class="row">
      <label><input type="checkbox" name="remember"> Beni hatırla</label>
    </div>

    <button class="submit" type="submit">Giriş Yap</button>
    <p id="status" role="status"></p>
  </form>

  <p class="foot">Hesabınız yok mu? <a href="/register.html">Kayıt olun</a></p>
</main>
<script>
  const form = document.getElementById('login');
  const username = document.getElementById('username');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  const status = document.getElementById('status');
  const submit = form.querySelector('.submit');

  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Gizle' : 'Göster';
    toggle.setAttribute('aria-pressed', show);
  });

  const setErr = (input, msg) => {
    document.getElementById(input.id + '-err').textContent = msg;
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    return !msg;
  };

  const validate = () => {
    const u = setErr(username,
      !username.value.trim() ? 'Kullanıcı adı gerekli.' :
      !/^[\p{L}\p{N}_.\-]{3,20}$/u.test(username.value.trim())
        ? 'Kullanıcı adı 3-20 karakter olmalı; harf, rakam ve _ . - içerebilir.' : '');
    const e = setErr(email,
      !email.value.trim() ? 'E-posta gerekli.' :
      !email.validity.valid ? 'Geçerli bir e-posta girin.' : '');
    const p = setErr(password,
      !password.value ? 'Şifre gerekli.' :
      password.value.length < 6 ? 'Şifre en az 6 karakter olmalı.' : '');
    return u && e && p;
  };

  [username, email, password].forEach(i => i.addEventListener('input', () => {
    if (i.getAttribute('aria-invalid') === 'true') validate();
  }));

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    status.textContent = ''; status.className = '';
    if (!validate()) {
      [username, email, password].find(i => i.getAttribute('aria-invalid') === 'true').focus();
      return;
    }
    submit.disabled = true; submit.textContent = 'Giriş yapılıyor…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username.value.trim(),
          email: email.value.trim(),
          password: password.value,
          remember: form.remember.checked,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '');
      status.textContent = 'Giriş başarılı, yönlendiriliyorsunuz…';
      status.className = 'ok';
      location.href = '/home.html';
    } catch (err) {
      status.textContent = err.message && !(err instanceof TypeError)
        ? err.message : 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.';
      status.className = 'bad';
    } finally {
      submit.disabled = false; submit.textContent = 'Giriş Yap';
    }
  });
</script>
</body>
</html>
