<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri · Sunucum</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; font-family: system-ui, sans-serif;
         background:#F5EBD8; color:#3A1218; }
  body.drag { outline:3px dashed #2F6B45; outline-offset:-6px; }
  .tabs { display:flex; align-items:flex-end; gap:.35rem; padding:.6rem 1rem 0;
          border-bottom:3px solid #2F6B45; }
  .tab { padding:.6rem 1.2rem; font-weight:600; color:#F5EBD8; background:#6D1A2A;
         border-radius:.6rem .6rem 0 0; text-decoration:none; opacity:.7; }
  .tab:hover { opacity:1; text-decoration:none; }
  .tab[aria-current=page] { opacity:1; box-shadow:inset 0 -4px 0 #A9D3A5; }
  .tabs .user { margin-left:auto; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
                justify-content:flex-end; padding-bottom:.4rem; font-size:.9rem; }
  .btn { padding:.4rem .8rem; font:inherit; color:#fff; background:#6D1A2A; border:0;
         border-radius:.5rem; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#8A2337; }
  h1 { font-size:1.75rem; margin:0 0 1rem; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible { outline:2px solid #2F6B45; outline-offset:2px; }
  main { max-width:72rem; margin:0 auto; padding:1.5rem 1rem 3rem; }

  #folders { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1.25rem; }
  .chip { padding:.4rem .9rem; font-size:.9rem; color:#2F6B45; background:#FFFAF0;
          border:1.5px solid #2F6B45; border-radius:999px; }
  .chip:hover { background:#E3EEDD; }
  .chip[aria-pressed=true] { color:#fff; background:#2F6B45; font-weight:600; }
  .chip.new { border-style:dashed; }
  /* Bir resim sürüklenirken klasör tuşları bırakma hedefi olur. */
  body.moving .chip[data-drop] { border-style:dashed; }
  body.moving .chip.new { visibility:hidden; }
  .chip.over { color:#fff; background:#2F6B45; transform:scale(1.1); }
  .box { width:calc(100% - 2rem); max-width:22rem; padding:0; color:#3A1218; background:#FFFAF0;
         border:0; border-radius:.9rem; overflow:hidden; box-shadow:0 1rem 3rem rgba(45,10,18,.45); }
  .box::backdrop { background:rgba(45,10,18,.6); }
  .box h2 { font-size:1.1rem; margin:0; padding:.9rem 1.25rem; color:#F5EBD8; background:#6D1A2A;
            border-bottom:4px solid #2F6B45; }
  .box form > div { padding:1.25rem; }
  .box label { display:block; font-size:.875rem; margin:0 0 .4rem; }
  .box select, .box input { width:100%; padding:.6rem .7rem; font:inherit; color:inherit; background:#fff;
                            border:1px solid #CDBB96; border-radius:.5rem; }
  .box select:focus-visible, .box input:focus-visible { outline:2px solid #2F6B45; outline-offset:2px; }
  .box .err { margin:.5rem 0 0; min-height:1.2em; font-size:.85rem; color:#B3261E; }
  .box .actions { display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem; }
  .box .actions .btn { padding:.5rem 1rem; }
  .box .cancel { color:#6D1A2A; background:none; box-shadow:inset 0 0 0 1.5px #6D1A2A; }
  .box .cancel:hover { background:#F5EBD8; }
  .box .go { background:#2F6B45; font-weight:600; }
  .box .go:hover { background:#3A8256; }
  .box .go:disabled { opacity:.6; cursor:progress; }

  #uploader { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin:0 0 1.25rem; }
  #pick { padding:.6rem 1.1rem; font-weight:600; background:#2F6B45; }
  #pick:hover { background:#3A8256; }
  #hint { font-size:.85rem; opacity:.7; }
  #bar { flex-basis:100%; width:100%; height:.5rem; accent-color:#2F6B45; }
  #upstatus { flex-basis:100%; margin:0; font-size:.9rem; min-height:1.2em; white-space:pre-line; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(10rem, 1fr)); gap:.75rem;
          list-style:none; margin:0; padding:0; }
  #grid li { position:relative; }
  .thumb { position:relative; display:block; width:100%; padding:0; background:#E9DCC0;
           border:2px solid #2F6B45; border-radius:.75rem; overflow:hidden; aspect-ratio:3/4; }
  .thumb img, .thumb video { display:block; width:100%; height:100%; object-fit:cover;
                             transition:transform .2s; pointer-events:none; }
  .thumb:hover img, .thumb:hover video { transform:scale(1.04); }
  .play { position:absolute; inset:0; margin:auto; display:grid; place-items:center;
          width:3rem; height:3rem; padding-left:.2rem; font-size:1.25rem; color:#fff;
          background:rgba(109,26,42,.9); border-radius:50%; }
  .thumb[draggable=true] { cursor:grab; }
  .thumb.dragging { opacity:.4; }
  #message { opacity:.75; text-align:center; padding:3rem 1rem; }

  #viewer { width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; padding:0;
           border:0; background:rgba(45,10,18,.96); color:#F5EBD8; }
  #viewer::backdrop { background:rgba(45,10,18,.96); }
  .view { position:relative; width:100%; height:100%; display:grid; place-items:center; padding:3.5rem 1rem; }
  /* Büyük görünüm: resmin çevresinde beyaz çiçekli köşe süsleri, üstte ve altta orta süs,
     yanlarda ince çizgi. --p süs payı; süs ölçüleri 90 birim = --p olacak şekilde ölçeklenir. */
  .view { --p:clamp(2rem, 7vmin, 4.5rem); --k:calc(var(--p) / 90); }
  .frame { position:relative; display:grid; padding:var(--p); }
  .big { display:block; object-fit:contain;
         max-width:calc(100vw - 2rem - 2 * var(--p)); max-height:calc(100dvh - 7rem - 2 * var(--p));
         min-width:calc(5.3 * var(--p)); min-height:calc(3.6 * var(--p)); }
  .orn { position:absolute; pointer-events:none; background:no-repeat center / 100% 100%; }
  .corner { width:calc(200 * var(--k)); height:calc(244 * var(--k));

<body>
<nav class="tabs" aria-label="Sayfalar">
  <a class="tab" id="home-tab" href="/home.html" hidden>Ana sayfa</a>
  <a class="tab" id="mine-tab" href="/galeri.html" hidden>Galerim</a>
  <span class="user">
    <span id="email"></span>
    <button class="btn" id="logout" type="button" hidden>Çıkış Yap</button>
    <a class="btn" id="login" href="/index.html" hidden>Giriş Yap</a>
  </span>
</nav>
<main>
  <h1 id="title">Galeri</h1>

  <div id="folders" role="group" aria-label="Klasörler" hidden></div>

  <div id="uploader" hidden>
    <button class="btn" id="pick" type="button">+ Resim / video yükle</button>
    <input id="files" type="file" multiple hidden
           accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime,.m4v,.mov">
    <span id="hint"></span>
    <button class="btn" id="rmdir" type="button" hidden>Klasörü sil</button>
    <progress id="bar" max="1" value="0" hidden></progress>
    <p id="upstatus" role="status"></p>
  </div>

  <ul id="grid"></ul>
  <p id="message" role="status">Yükleniyor…</p>
</main>

<dialog id="viewer" aria-label="Büyük görünüm">
  <div class="view">
    <div class="frame">
      <span class="orn corner tl"></span><span class="orn corner tr"></span>
      <span class="orn corner bl"></span><span class="orn corner br"></span>
      <span class="orn mid t"></span><span class="orn mid b"></span>
      <span class="orn line l"></span><span class="orn line r"></span>
      <img class="big" id="big-img" alt="" hidden>
      <video class="big" id="big-video" controls playsinline hidden></video>
    </div>
    <button class="ctl" id="close" type="button" aria-label="Kapat">×</button>
    <button class="ctl" id="prev" type="button" aria-label="Önceki">‹</button>
    <button class="ctl" id="next" type="button" aria-label="Sonraki">›</button>
    <button class="ctl" id="trash" type="button" aria-label="Sil" title="Sil" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
      </svg>
    </button>
    <p id="caption"></p>
  </div>
</dialog>

<dialog class="box" id="creator" aria-labelledby="creator-title">
  <form id="creator-form" novalidate>
    <h2 id="creator-title">Yeni klasör</h2>
    <div>
      <label for="folder-name">Klasörün adı</label>
      <input id="folder-name" type="text" maxlength="50" autocomplete="off"
             placeholder="örn. Yazlık kombinler" aria-describedby="creator-err">
      <p class="err" id="creator-err" aria-live="polite"></p>
      <div class="actions">
        <button class="btn cancel" id="creator-cancel" type="button">Vazgeç</button>
        <button class="btn go" id="creator-ok" type="submit">Oluştur</button>
      </div>
    </div>
  </form>
</dialog>

<script>
  const TYPES = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif', 'mp4', 'm4v', 'webm', 'mov'];
  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const message = $('message');
  const viewer = $('viewer');
  const bigImg = $('big-img');
  const bigVideo = $('big-video');
  const caption = $('caption');
  const prev = $('prev');
  const next = $('next');
  const files = $('files');
  const bar = $('bar');
  const upstatus = $('upstatus');
  const creator = $('creator');
  const folderName = $('folder-name');
  const creatorErr = $('creator-err');
  let items = [];       // bütün klasörlerdeki dosyalar
  let visible = [];     // seçili klasörde görünenler
  let folders = [];
  let folder = null;    // null = ana galeri (klasöre konmamış dosyalar)
  let dragging = null;  // klasöre taşımak için sürüklenen dosya
  let current = 0;
  let canUpload = false;  // yalnızca kendi galerisinde ve yükleme izni varsa
  let owner = null;       // galerisi gösterilen kullanıcının adı
  let mine = false;
  // ?u=ad başka bir kullanıcının galerisini gösterir; yoksa giriş yapanın kendi galerisi açılır.
  const wanted = new URLSearchParams(location.search).get('u');
  let maxUpload = Infinity;
  let uploading = false;

  // -- büyük görünüm --

  const stopVideo = () => {
    bigVideo.pause();
    bigVideo.removeAttribute('src');
    bigVideo.load();
  };

  const show = (i) => {
    current = (i + visible.length) % visible.length;
    const item = visible[current];
    const isVideo = item.type === 'video';
    stopVideo();
    bigImg.hidden = isVideo;
    bigVideo.hidden = !isVideo;
    if (isVideo) {
      bigVideo.src = item.url;
      bigVideo.play().catch(() => {});
    } else {
      bigImg.src = item.url;
      bigImg.alt = item.name;
    }
    caption.textContent = `${item.name} · ${current + 1} / ${visible.length}`;
  };

  const open = (i) => {
    show(i);
    prev.hidden = next.hidden = visible.length < 2;
    $('trash').hidden = !canUpload;
    viewer.showModal();
  };

  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  $('close').addEventListener('click', () => viewer.close());
  viewer.addEventListener('close', stopVideo);
  // Resmin/videonun dışındaki boşluğa tıklanınca kapat.
  viewer.addEventListener('click', (ev) => {
    if (ev.target === viewer || ev.target.matches('.view, .frame')) viewer.close();
  });
  viewer.addEventListener('keydown', (ev) => {
    // Video odaktayken ok tuşları videoyu sarar.
    if (visible.length < 2 || ev.target === bigVideo) return;
    if (ev.key === 'ArrowLeft') show(current - 1);
    if (ev.key === 'ArrowRight') show(current + 1);
  });

  // -- liste --

  // Hata iletisini döner; başarılıysa null. Yanıt gövdesi onOk'a verilir.
  const post = (url, body, onOk) => fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(async (res) => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return data.error || 'İşlem yapılamadı. Tekrar deneyin.';
    if (onOk) onOk(data);
    return null;
  }).catch(() => 'Bağlantı hatası.');

  // İşlemi yapar, hata varsa gösterir, listeyi yeniler.
  const act = async (url, body) => {
    const error = await post(url, body);
    upstatus.textContent = error || '';
    await load();
    return !error;
  };

  $('trash').addEventListener('click', () => {
    const item = visible[current];
    if (!item || !confirm(`"${item.name}" silinsin mi?`)) return;
    viewer.close();
    act('/api/medya/sil', { file: item.file, folder: item.folder });
  });

  // Seçili klasör adres çubuğunda tutulur (#k=ad), böylece bağlantısı paylaşılabilir.
  const select = (name) => {
    folder = name;
    history.replaceState(null, '', name === null ? location.pathname + location.search : '#k=' + encodeURIComponent(name));
    render();
  };

  const chip = (label, pressed, onClick) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = label;
    if (pressed !== null) btn.setAttribute('aria-pressed', String(pressed));
    btn.addEventListener('click', onClick);
    return btn;
  };

  const renderFolders = () => {
    const bar = $('folders');
    bar.replaceChildren();
    bar.hidden = !folders.length && !canUpload;
    if (folders.length) {
      if (canUpload) {
        // Yalnızca klasördeki bir dosya sürüklenirken görünür: klasörden çıkarıp ana galeriye taşır.
        const home = chip('↩ Ana galeri', null, () => select(null));
        home.dataset.drop = '';
        home.id = 'home-drop';
        home.hidden = true;
        bar.append(home);
      }
      for (const name of folders) {
        const count = items.filter((item) => item.folder === name).length;
        // Seçili klasöre yeniden basmak ana galeriye döner.
        const btn = chip(`${name} (${count})`, folder === name, () => select(folder === name ? null : name));
        btn.dataset.drop = name;
        bar.append(btn);
      }
    }
    if (canUpload) {
      const add = chip('+ Yeni klasör', null, () => {
        folderName.value = '';
        creatorErr.textContent = '';
        creator.showModal();
        folderName.focus();
      });
      add.classList.add('new');
      bar.append(add);
    }
  };

  const endDrag = () => {
    dragging = null;
    document.body.classList.remove('moving');
    const home = $('home-drop');
    if (home) home.hidden = true;
    document.querySelectorAll('.dragging, .chip.over').forEach((el) => el.classList.remove('dragging', 'over'));
  };

  const render = () => {
    if (folder !== null && !folders.includes(folder)) folder = null;
    visible = items.filter((item) => item.folder === (folder ?? ''));
    renderFolders();
    $('hint').textContent = folder === null
      ? 'ya da dosyaları bu sayfaya sürükleyip bırakın' + (folders.length ? ' · taşımak için resmi klasörün üstüne sürükleyin' : '')
      : `“${folder}” klasörüne yüklenir · taşımak için resmi başka klasörün üstüne sürükleyin`;
    $('rmdir').hidden = folder === null;
    grid.replaceChildren();
    message.hidden = visible.length > 0;
    message.textContent = folder !== null ? 'Bu klasör boş.'
      : folders.length ? 'Görmek için bir klasör seçin.'
      : mine ? 'Henüz bir şey eklenmemiş.'
      : owner ? 'Bu galeride henüz bir şey yok.'
      : 'Kendi galerinizi oluşturmak için giriş yapın.';
    visible.forEach((item, i) => {
      const li = document.createElement('li');
      // Bağlantı olması sürüklemeyi her tarayıcıda mümkün kılar; tıklayınca büyük görünüm açılır.
      const btn = document.createElement('a');
      btn.href = item.url;
      btn.className = 'thumb';
      btn.draggable = canUpload && folders.length > 0;
      btn.addEventListener('dragstart', (ev) => {
        dragging = item;
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', item.name);
        btn.classList.add('dragging');
        document.body.classList.add('moving');
        const home = $('home-drop');
        if (home) home.hidden = !item.folder;
      });
      btn.addEventListener('dragend', endDrag);
      if (item.type === 'video') {
        btn.setAttribute('aria-label', `${item.name} videosunu oynat`);
        const el = document.createElement('video');
        // #t ile ilk kare küçük resim olarak görünür.
        el.src = item.url + '#t=0.1';
        el.preload = 'metadata';
        el.muted = true;
        el.playsInline = true;
        const play = document.createElement('span');
        play.className = 'play';
        play.textContent = '▶';
        play.setAttribute('aria-hidden', 'true');
        btn.append(el, play);
      } else {
        btn.setAttribute('aria-label', `${item.name} resmini büyüt`);
        const el = document.createElement('img');
        el.src = item.url;
        el.alt = item.name;
        el.loading = 'lazy';
        btn.append(el);
      }
      btn.addEventListener('click', (ev) => { ev.preventDefault(); open(i); });
      li.append(btn);
      grid.append(li);
    });
  };

  const load = () => fetch('/api/medya' + (wanted ? '?u=' + encodeURIComponent(wanted) : '')).then(async (res) => {
    if (res.status === 404) {
      $('title').textContent = 'Galeri';
      grid.replaceChildren();
      $('folders').hidden = $('uploader').hidden = true;
      message.hidden = false;
      message.textContent = `“${wanted}” adında bir kullanıcı yok.`;
      return;
    }
    if (!res.ok) throw new Error();
    const data = await res.json();
    items = data.items;
    folders = data.folders;
    maxUpload = data.max_upload;
    owner = data.owner;
    mine = data.mine;
    canUpload = Boolean(mine && data.user.can_upload);
    const title = mine ? 'Galerim' : owner ? `${owner} · Galeri` : 'Galeri';
    $('title').textContent = title;
    document.title = `${title} · Sunucum`;
    $('email').textContent = data.user ? data.user.username || data.user.email : '';
    $('home-tab').hidden = false;  // ana sayfa herkese açık
    $('mine-tab').hidden = $('logout').hidden = !data.user;
    if (mine) $('mine-tab').setAttribute('aria-current', 'page');
    else $('mine-tab').removeAttribute('aria-current');
    $('login').hidden = Boolean(data.user);
    $('uploader').hidden = !canUpload;
    render();
  }).catch(() => {
    message.hidden = false;
    message.textContent = 'Galeri yüklenemedi. Sayfayı yenileyip tekrar deneyin.';
  });

  // -- klasör işlemleri --

  // Sürüklenen resim bir klasör tuşuna bırakılınca o klasöre taşınır.
  const dropTarget = (ev) => {
    const el = dragging && ev.target.closest('.chip[data-drop]');
    return el && el.dataset.drop !== dragging.folder ? el : null;
  };
  $('folders').addEventListener('dragover', (ev) => {
    const el = dropTarget(ev);
    if (!el) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    el.classList.add('over');
  });
  $('folders').addEventListener('dragleave', (ev) => {
    const el = ev.target.closest('.chip');
    if (el) el.classList.remove('over');
  });
  $('folders').addEventListener('drop', (ev) => {
    const el = dropTarget(ev);
    if (!el) return;
    ev.preventDefault();
    const item = dragging;
    endDrag();
    act('/api/medya/tasi', { file: item.file, folder: item.folder, to: el.dataset.drop });
  });

  // Yeni klasör penceresi: hata olursa pencere açık kalır ve hatayı gösterir.
  $('creator-cancel').addEventListener('click', () => creator.close());
  $('creator-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name = folderName.value.trim();
    if (!name) {
      creatorErr.textContent = 'Bir ad yazın.';
      folderName.focus();
      return;
    }
    $('creator-ok').disabled = true;
    let created = null;
    const error = await post('/api/klasor', { name }, (data) => { created = data.folder; });
    $('creator-ok').disabled = false;
    if (error) {
      creatorErr.textContent = error;
      folderName.focus();
      return;
    }
    creator.close();
    upstatus.textContent = '';
    await load();
    select(created);
  });

  $('rmdir').addEventListener('click', () => {
    if (folder !== null && confirm(`"${folder}" klasörü silinsin mi?`)) act('/api/klasor/sil', { name: folder });
  });

  // -- yükleme --

  const uploadOne = (file, label) => new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/yukle?name=' + encodeURIComponent(file.name)
      + '&klasor=' + encodeURIComponent(folder ?? ''));
    xhr.upload.onprogress = (ev) => {
      if (!ev.lengthComputable) return;
      bar.value = ev.loaded / ev.total;
      upstatus.textContent = `${label} ${file.name} yükleniyor… %${Math.round(100 * ev.loaded / ev.total)}`;
    };
    xhr.onload = () => {
      if (xhr.status === 201) return resolve(null);
      let error = 'Yüklenemedi.';
      try { error = JSON.parse(xhr.responseText).error || error; } catch {}
      resolve(error);
    };
    xhr.onerror = () => resolve('Bağlantı hatası.');
    xhr.send(file);
  });

  const upload = async (list) => {
    if (uploading || !list.length) return;
    uploading = true;
    $('pick').disabled = true;
    bar.hidden = false;
    const errors = [];
    let done = 0;
    for (const [i, file] of list.entries()) {
      const ext = file.name.split('.').pop().toLowerCase();
      let error;
      if (!TYPES.includes(ext)) error = 'Desteklenmeyen dosya türü.';
      else if (file.size > maxUpload) error = `Dosya çok büyük (en fazla ${Math.floor(maxUpload / 1024 / 1024)} MB).`;
      else {
        bar.value = 0;
        error = await uploadOne(file, list.length > 1 ? `(${i + 1}/${list.length})` : '');
      }
      if (error) errors.push(`${file.name}: ${error}`);
      else done++;
    }
    uploading = false;
    $('pick').disabled = false;
    bar.hidden = true;
    files.value = '';
    upstatus.textContent = [done ? `${done} dosya yüklendi.` : '', ...errors].filter(Boolean).join('\n');
    load();
  };

  $('pick').addEventListener('click', () => files.click());
  files.addEventListener('change', () => upload([...files.files]));

  // Sürükle-bırak
  const hasFiles = (ev) => canUpload && !dragging && ev.dataTransfer && [...ev.dataTransfer.types].includes('Files');
  addEventListener('dragover', (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    document.body.classList.add('drag');
  });
  addEventListener('dragleave', (ev) => {
    if (!ev.relatedTarget) document.body.classList.remove('drag');
  });
  addEventListener('drop', (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    document.body.classList.remove('drag');
    upload([...ev.dataTransfer.files]);
  });

  $('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  });

  if (location.hash.startsWith('#k=')) {
    try { folder = decodeURIComponent(location.hash.slice(3)); } catch {}
  }
  load().then(() => {
    // Ana galeride gösterilecek dosya yoksa ilk klasörle açıl.
    if (folder === null && folders.length && !items.some((item) => !item.folder)) select(folders[0]);
  });
</script>
</body>
</html>
